name: tyks-aei

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aei
      POSTGRES_USER: aei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aei_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aei -d aei"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
